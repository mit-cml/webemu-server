apiVersion: apps/v1
kind: Deployment
metadata:
  name: webemu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webemu
  template:
    metadata:
      labels:
        app: webemu
    spec:
      containers:
      - name: webemu
        image: 127.0.0.1:32000/wserve@sha256:c77875ffdbadbff424d54fa34aca2f6625c3947596ca688a13ad75554a3b4e43
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: webemu
spec:
  type: ClusterIP
  selector:
    app: webemu
  ports:
  - port: 80
    targetPort: 8080
    name: webemu
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webemu
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.middlewares: default-http-redirect@kubernetescrd
    # traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: test.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webemu
                port:
                  number: 80
  tls:
  - hosts:
    - test.example.com
    secretName: test-tls-secret
